spring:
  profiles:
    default: prod
  application:
    name: javaLab4

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true

  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: javaLab4
    ttl-seconds: 900
    refresh-ttl-seconds: 604800
